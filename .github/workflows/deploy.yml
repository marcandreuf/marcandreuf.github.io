name: Deploy to GitHub Pages

on:
  # Trigger the workflow every time you push to the `main` branch
  # Using a different branch name? Replace `main` with your branch’s name
  push:
    branches: [ main ]
    # Ignore changes to the README.md file and todo files
    paths-ignore:
      - README.md
      - todo
  # Allows you to run this workflow manually from the Actions tab on GitHub.
  workflow_dispatch:

# Allow this job to clone the repo and create a page deployment
permissions:
  contents: read
  pages: write
  id-token: write


# set env vars in Github settings here
env:
  SITE_URL: 'https://www.marcandreuf.com'
  PLAUSIBLE_SCRIPT_URL: ''
  PLAUSIBLE_DOMAIN: 'marcandreuf.com'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@v4
        
      - name: build within a container
        run: |
          docker run --rm -t -v .:/home/runner/workspace \
            -e SITE_URL \
            -e PLAUSIBLE_SCRIPT_URL \
            -e PLAUSIBLE_DOMAIN \
            ghcr.io/marcandreuf/base-images/frontend-node22-pnpm-build:main\
            /bin/bash -c "set -e && \
              pnpm install --frozen-lockfile && \
              pnpm exec playwright install chromium-headless-shell && \
              pnpm exec astro sync && \
              pnpm lint && \
              pnpm check-types && \
              pnpm build && \
              pnpm verify"
        # astro sync must precede check-types. .astro/types.d.ts is tracked, but
        # it only /// references env.d.ts and content.d.ts, which are generated
        # and gitignored. On a fresh clone tsc therefore fails with missing
        # astro:env exports and untyped getCollection. The sync is here rather
        # than inside the check-types script because it loads astro.config.ts,
        # which requires SITE_URL, and that would make the bare `pnpm
        # check-types` unusable locally.

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist/"


  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
