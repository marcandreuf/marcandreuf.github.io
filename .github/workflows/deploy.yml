name: Deploy to GitHub Pages

on:
  # Trigger the workflow every time you push to the `main` branch
  # Using a different branch name? Replace `main` with your branch’s name
  push:
    branches: [ main ]
    # Only deploy when something that affects the built site changes.
    #
    # This is a denylist, so anything not listed here still deploys. That is
    # deliberate: a missed entry costs one unnecessary build, whereas an
    # allowlist that misses a path silently leaves the live site stale.
    #
    # Do NOT add a blanket '**/*.md' here - the blog posts in
    # src/content/post are markdown and must trigger a deploy.
    #
    # Deliberately NOT ignored, because the CI build runs lint, check-types
    # and verify, so these can all change whether the build passes:
    #   eslint.config.mjs, tsconfig.json, scripts/**, package.json,
    #   pnpm-lock.yaml, plugins/**, .astro/**, env.d.ts
    # .github/workflows/** is also not ignored, so a change to this file
    # triggers a run that validates it.
    paths-ignore:
      # Repository documentation. Note the filename is 'Readme.md' - these
      # filters are CASE-SENSITIVE, so 'README.md' alone never matched it and
      # every readme edit rebuilt and redeployed the site.
      - 'Readme.md'
      - 'README.md'
      - 'CLAUDE.md'
      - 'LICENSE'
      - 'todo'
      # Local tooling and editor setup - no effect on the built output.
      - '.devcontainer/**'
      - '.gitignore'
      - '.prettierrc.js'
      - '.prettierignore'
      - '.env.development.example'
      - '.env.production.example'
      # Self-hosted docker/nginx deployment path. The Pages build uses the
      # prebuilt ghcr.io container image, not this Dockerfile.
      - 'docker/**'
  # Allows you to run this workflow manually from the Actions tab on GitHub.
  workflow_dispatch:

# Allow this job to clone the repo and create a page deployment
permissions:
  contents: read
  pages: write
  id-token: write


# set env vars in Github settings here
env:
  # Must be the hostname that serves 200, NOT the one that redirects.
  # Cloudflare 301s www -> apex, so canonical/sitemap/OG URLs must be apex.
  # Using www here pointed every canonical at a redirect and stalled indexing.
  SITE_URL: 'https://marcandreuf.com'
  PLAUSIBLE_SCRIPT_URL: ''
  PLAUSIBLE_DOMAIN: 'marcandreuf.com'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@v4
        
      - name: build within a container
        run: |
          docker run --rm -t -v .:/home/runner/workspace \
            -e SITE_URL \
            -e PLAUSIBLE_SCRIPT_URL \
            -e PLAUSIBLE_DOMAIN \
            ghcr.io/marcandreuf/base-images/frontend-node22-pnpm-build:main\
            /bin/bash -c "set -e && \
              pnpm install --frozen-lockfile && \
              pnpm exec playwright install chromium-headless-shell && \
              pnpm exec astro sync && \
              pnpm lint && \
              pnpm check-types && \
              pnpm build && \
              pnpm verify"
        # astro sync must precede check-types. .astro/types.d.ts is tracked, but
        # it only /// references env.d.ts and content.d.ts, which are generated
        # and gitignored. On a fresh clone tsc therefore fails with missing
        # astro:env exports and untyped getCollection. The sync is here rather
        # than inside the check-types script because it loads astro.config.ts,
        # which requires SITE_URL, and that would make the bare `pnpm
        # check-types` unusable locally.

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist/"


  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
